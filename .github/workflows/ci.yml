name: Django CI with Docker

on:
  push:
    branches: [ main, develop, version ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create .env file
      run: |
        cat > .env << EOF
        SECRET_KEY=test-secret-key-for-ci
        DEBUG=false
        ALLOWED_HOSTS=localhost,127.0.0.1
        DB_NAME=test_retailconnect_db
        DB_USER=testuser
        DB_PASSWORD=testpassword
        DB_HOST=db-test
        DB_PORT=3306
        REDIS_URL=redis://redis-test:6379/0
        EOF

    - name: Build Docker images
      run: docker-compose -f docker-compose.test.yml build

    - name: Run tests
      run: docker-compose -f docker-compose.test.yml up --abort-on-container-exit

    - name: Cleanup
      if: always()
      run: docker-compose -f docker-compose.test.yml down -v

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build production image
      run: docker-compose -f docker-compose.prod.yml build

    - name: Login to DockerHub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push to DockerHub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag retailconnect_web:latest ${{ secrets.DOCKER_USERNAME }}/retailconnect:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/retailconnect:latest
