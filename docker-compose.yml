version: "3.9"

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: retailconnect_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-retailconnect_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}      # root password
      MYSQL_USER: ${DB_USER:-retailuser}                         # normal user
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-retailpassword}        # normal user's password
    ports:
      - "3307:3306"   # host:container
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - retailconnect_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: retailconnect_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - retailconnect_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build: .
    container_name: retailconnect_web
    restart: always
    command: gunicorn retailconnect.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retailconnect_network

  # Celery Worker
  celery:
    build: .
    container_name: retailconnect_celery
    restart: always
    command: celery -A retailconnect worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - retailconnect_network

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build: .
    container_name: retailconnect_celery_beat
    restart: always
    command: celery -A retailconnect beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - retailconnect_network

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  retailconnect_network:
    driver: bridge
